site_name: Django Boost

extra_css:
  - assets/css/nerd-font.css
  - assets/css/extras.css

extra_javascript:
  - assets/js/post-zoom.js
  - assets/js/extras.js

theme:
  name: material
  favicon: "assets/favicon.webp"
  custom_dir: overrides
  language: es

  icon:
    logo: fontawesome/solid/d

  font:
    text: Exo
    code: JetBrains Mono
  
  palette:
    # Light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro

    # Dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro

  features:
    - navigation.tabs
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - abbr
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.snippets
  - pymdownx.keys
  - def_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - blog:
      post_date_format: short # long | medium | short
      post_url_format: "{slug}"
      archive: false

extra:
  generator: false

copyright: Copyright &copy; 2024 @mcherrera
